  FLOOR_LABELS: [ "field", "water", "river", "sea", "lake", "dirt track", "earth", "grass", "floor", "land", "road", "path", "sidewalk", "sand" ]

# network config
  SDF_CONFIG:
    d_in: 3
    d_out: 513
    d_hidden: 512
    n_layers: 8
    skip_in: (4,)
    multires: 6
    bias: 0.5
    scale: 1
    geometric_init: True
    weight_norm: True
    inside_outside: False

  COLOR_CONFIG:
    d_in: 9
    d_feature: 512
    mode: "idr"
    d_out: 3
    d_hidden: 256 
    n_layers: 4
    head_channels: 128
    static_head_layers: 2
    weight_norm: True
    multires_view: 4

  S_CONFIG:
    init_val: 0.3

# loss config
  LOSS:
    coef: 1.0
    igr_weight: 0.0001
    mask_weight: 0.1
    depth_weight: 0.1
    floor_weight: 0.01

